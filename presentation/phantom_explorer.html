<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PST-102228 · Phantom Semantics Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F3; --panel:#FFFFFF; --panel2:#F6F9FA;
  --ink:#16232A; --ink2:#46585F; --ink3:#7C8C92;
  --line:#DBE3E7; --line2:#C3D0D5;
  --teal:#0E7C86; --teal-ink:#0B5A61; --teal-bg:#E1F1F2;
  --amber:#A8620A; --amber-bg:#F5EAD8;
  --alert:#B33A1A; --alert-bg:#F6E2DB;
  --f-display:'Space Grotesk',system-ui,sans-serif;
  --f-body:'Inter',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1619; --panel:#172227; --panel2:#1C2A30;
  --ink:#E7EEF0; --ink2:#A9B8BD; --ink3:#72858B;
  --line:#26343A; --line2:#35474E;
  --teal:#40B7C0; --teal-ink:#8FD8DC; --teal-bg:#123037;
  --amber:#E0A44A; --amber-bg:#2C2412;
  --alert:#E08161; --alert-bg:#331A10;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--f-mono)}
a{color:var(--teal)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line2);padding:14px 24px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px}
.top .id{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--teal);text-transform:uppercase}
.top h1{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;letter-spacing:-.01em}
.top .maker{color:var(--ink3);font-size:13px}
.stats{margin-left:auto;display:flex;gap:18px;font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.stats b{color:var(--ink);font-weight:500}

.wrap{display:grid;grid-template-columns:236px 1fr;gap:0;align-items:start}

/* spine (signature) */
.spine{position:sticky;top:64px;align-self:start;padding:22px 16px 22px 24px;height:calc(100vh - 64px);overflow:auto}
.spine .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px 2px}
.stack{position:relative}
.dome{display:block;margin:0 auto -1px;filter:drop-shadow(0 1px 0 var(--line2))}
.seg{display:block;width:100%;text-align:left;border:1px solid var(--line2);border-top:none;background:var(--panel);color:var(--ink);
  padding:11px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:13.5px;letter-spacing:-.01em;position:relative;transition:background .12s}
.seg:first-of-type{border-top:1px solid var(--line2)}
.seg:hover{background:var(--panel2)}
.seg .band{display:block;font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.seg .n{position:absolute;right:11px;top:11px;font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.seg.active{background:var(--teal-bg);border-color:var(--teal);z-index:2}
.seg.active::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--teal)}
.seg.active .n{color:var(--teal-ink)}
.opt{font-family:var(--f-mono);font-size:9px;color:var(--amber);border:1px solid var(--amber);border-radius:3px;padding:0 3px;margin-left:6px;vertical-align:middle;letter-spacing:.08em}
.base{height:14px;background:var(--line2);width:calc(100% + 8px);margin:-1px -4px 0;border-radius:0 0 4px 4px}
.legend{margin-top:18px;font-size:11px;color:var(--ink2);line-height:1.9}
.legend .k{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* detail */
.detail{padding:24px 28px 90px;min-width:0}
.dhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:4px}
.dhead h2{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0}
.src{font-family:var(--f-mono);font-size:11px;color:var(--ink3);border:1px solid var(--line2);border-radius:4px;padding:1px 7px}
.metrics{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.metric{font-family:var(--f-mono);font-size:11px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 8px}

/* context block */
.ctx{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:14px 16px;margin:0 0 8px}
.ctx.gap{border-left-color:var(--alert);background:var(--alert-bg)}
.ctx p{margin:0}
.ctx .empty{color:var(--alert);font-family:var(--f-mono);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;line-height:1.4;border-radius:4px;padding:3px 8px;border:1px solid transparent}
.tag .kk{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px;font-weight:500}
.tag.manual{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-ink)}
.tag.manual .kk{color:var(--teal)}
.tag.physics{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.tag.physics .kk{color:var(--amber)}

/* regions */
.section-lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.region{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.rhead{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:15px}
.rhead:hover{background:var(--panel2)}
.rhead .chev{color:var(--ink3);transition:transform .15s;font-family:var(--f-mono);font-size:12px}
.region.open .chev{transform:rotate(90deg)}
.rcount{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.rcount.warn{color:var(--alert);border-color:var(--alert);background:var(--alert-bg)}
.rbody{padding:0 16px 16px;display:none}
.region.open .rbody{display:block}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:7px 10px;border-bottom:1px solid var(--line2)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--panel2)}
.cid{font-family:var(--f-mono);font-weight:500;color:var(--teal-ink);white-space:nowrap}
.num{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.dim{color:var(--ink3)}
.rv{font-family:var(--f-mono);font-size:12px;line-height:1.7}
.rv .q{color:var(--ink3)}
.rv .band{color:var(--ink3);font-size:11px}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line2);color:var(--ink2)}
.pill.chiral{border-color:var(--teal);color:var(--teal-ink);background:var(--teal-bg)}

/* crossing cards */
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.xcard{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel2)}
.xcard .ang{font-family:var(--f-display);font-weight:700;font-size:20px}
.xcard .cid{font-size:12px}
.xcard .row{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11.5px;margin-top:6px;color:var(--ink2)}

/* search + meta rows */
.tools{display:flex;gap:10px;align-items:center;margin:0 0 4px}
.search{flex:1;max-width:280px;font-family:var(--f-mono);font-size:12px;padding:6px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);color:var(--ink)}
.search:focus{outline:none;border-color:var(--teal)}
.hidden{display:none}
.metarow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.mcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.mcard .t{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.mcard .v{font-family:var(--f-display);font-weight:600;margin-top:2px}
.mcard small{color:var(--ink3);font-weight:400;font-size:12px}

@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  .spine{position:static;height:auto;display:block;padding:16px}
  .stack{display:flex;flex-wrap:wrap;gap:8px}
  .dome,.base{display:none}
  .seg{border-radius:8px;border-top:1px solid var(--line2);width:auto;flex:1;min-width:150px}
  .stats{width:100%;margin-left:0;flex-wrap:wrap}
}
</style>
</head>

            "n_slices": 19,
            "slice_thickness_mm": 2.0,
            "orientation": "Transversal, P>>A"
          }
        ]
      },
      "hardware": []
    }
  ],
  "assemblies": [
    {
      "context": "",
      "name": "Central column / tie-rods",
      "hardware": [
        {
          "context": "",
          "source": {
            "origin": "figure_observed",
            "note": ""
          },
          "type": "tie_rod",
          "function": "dome-to-base spine",
          "mr_safe": true
        }
      ]
    },
    {
      "context": "",
      "name": "Octagonal base flange",
      "hardware": [
        {
          "context": "",
          "source": {
            "origin": "figure_observed",
            "note": ""
          },
          "type": "flange",
          "function": "coil seating / orientation",
          "mr_safe": true
        }
      ]
    },
    {
      "context": "",
      "name": "Pressure Compensation Disk (optional)",
      "hardware": [
        {
          "context": "",
          "source": {
            "page": 8,
            "section": "3.0",
            "origin": "manual",
            "note": ""
          },
          "type": "bellows_spring",
          "function": "thermal/pressure compensation",
          "mr_safe": true
        }
      ]
    }
  ]
}</script>
<script>
const PHANTOM = JSON.parse(document.getElementById('phantom-data').textContent);
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// --- parse [manual: ..] [physics: ..] tags out of a context string ---
function splitContext(str){
  if(!str||!str.trim()) return {prose:'', tags:[]};
  const tags=[]; let prose=str;
  prose=prose.replace(/\[(manual|physics):\s*([^\]]*)\]/g,(_,k,v)=>{tags.push({k,v:v.trim()});return '';});
  return {prose:prose.trim(), tags};
}
function ctxBlock(str, {expect=true}={}){
  const {prose,tags}=splitContext(str);
  if(!prose){
    return expect ? `<div class="ctx gap"><span class="empty">▲ needs context</span></div>` : '';
  }
  const t = tags.map(t=>`<span class="tag ${t.k}"><span class="kk">${t.k}</span>${esc(t.v)}</span>`).join('');
  return `<div class="ctx"><p>${esc(prose)}</p>${t?`<div class="tags">${t}</div>`:''}</div>`;
}
function srcTag(s){
  if(!s) return '';
  const parts=[]; if(s.page) parts.push('p.'+s.page); if(s.section) parts.push('§'+s.section);
  if(s.origin && s.origin!=='manual') parts.push(s.origin);
  return parts.length?`<span class="src">${esc(parts.join(' '))}</span>`:'';
}
const layoutStr = l => !l ? '' :
  l.kind==='grid' ? `r${l.row}·c${l.col}` :
  l.kind==='axis_role' ? `${l.orientation}${l.band?' '+l.band:''}${l.index?' #'+l.index:''}` :
  l.kind==='array' ? `${l.array}${l.array_index?' #'+l.array_index:''}` : '';

function refVals(rvs){
  if(!rvs||!rvs.length) return '<span class="dim">—</span>';
  return `<div class="rv">`+rvs.map(r=>{
    const band=(r.unc_minus!=null&&r.unc_plus!=null)?` <span class="band">[${r.unc_minus}–${r.unc_plus}]</span>`:'';
    const at=r.temp_C!=null?` <span class="band">@${r.temp_C}°C</span>`:'';
    const cite=r.citation?` <span class="band">${esc(r.citation)}</span>`:'';
    return `<div><span class="q">${esc(r.quantity)}</span> ${r.value} ${esc(r.unit)}${band}${at}${cite}</div>`;
  }).join('')+`</div>`;
}

// --- fixture renderers by region_type ---
function renderFixtures(region){
  const fx=region.fixtures||[];
  if(!fx.length) return '';
  const type=fx[0].region_type;

  if(type==='fluid_cell'){
    return table(['ID','Solute','Concentration','Layout','Reference values'],
      fx.map(f=>`<tr data-id="${esc(f.id)}"><td class="cid">${esc(f.id)}</td>
        <td class="mono">${esc(f.solute)}</td><td>${esc(f.concentration||'—')}</td>
        <td class="mono dim">${esc(layoutStr(f.layout))}</td><td>${refVals(f.reference_values)}</td></tr>`).join(''));
  }
  if(type==='fiber_tract'){
    const round=fx.some(f=>f.fiber_type==='round_taxon');
    const cols=['ID','Size mm','Density %','n Taxons', round?'Fibre Ø / holes·mm²':'Orientation','Layout'];
    return table(cols, fx.map(f=>`<tr data-id="${esc(f.id)}"><td class="cid">${esc(f.id)}</td>
      <td class="num">${f.tract_size_mm}</td><td class="num">${f.density_pct}</td>
      <td class="num">${f.n_taxons!=null?f.n_taxons.toLocaleString():'—'}</td>
      <td class="mono dim">${round?`${f.fiber_diameter_um||'—'}µm / ${f.hole_density_per_mm2?f.hole_density_per_mm2.toLocaleString():'—'}`:esc(f.orientation||'—')}</td>
      <td class="mono dim">${esc(layoutStr(f.layout))}</td></tr>`).join(''));
  }
  if(type==='crossing_fixture'){
    const card=f=>{
      const p=f.primary_tract,c=f.crossing_tract;
      return `<div class="xcard" data-id="${esc(f.id)}"><div class="ang">${f.crossing_angle_deg}°</div>
        <div class="cid">${esc(f.id)}</div>
        <div class="row"><span>primary ${p.density_pct}%</span><span>${p.n_taxons?p.n_taxons.toLocaleString():''}</span></div>
        <div class="row"><span>crossing ${c.density_pct}%</span><span>${c.n_taxons?c.n_taxons.toLocaleString():''}</span></div></div>`;
    };
    return `<div class="xgrid">${fx.map(card).join('')}</div>`;
  }
  if(type==='hole_pattern'){
    return table(['ID','Contrast','Ø mm','Skew°','Insert µm','Objects mm'],
      fx.map(f=>`<tr data-id="${esc(f.id)}"><td class="cid">${esc(f.id)}</td>
        <td>${esc(f.contrast)}</td><td class="num">${f.hole_diameter_mm??'—'}</td>
        <td class="num">${f.skew_deg??'—'}</td><td class="num">${f.insert_thickness_um??'—'}</td>
        <td class="mono dim">${f.object_diameters_mm&&f.object_diameters_mm.length?esc(f.object_diameters_mm.join(' / ')):'—'}</td></tr>`).join(''));
  }
  if(type==='ramp'){
    return table(['ID','Type','Dimensions mm','Angle°','Note'],
      fx.map(f=>`<tr data-id="${esc(f.id)}"><td class="cid">${esc(f.id)}</td>
        <td>${esc(f.ramp_type)}</td><td class="mono">${esc(f.dimensions_mm||'—')}</td>
        <td class="num">${f.angle_deg??'—'}</td><td class="dim">${esc(splitContext(f.context).prose||'—')}</td></tr>`).join(''));
  }
  return '<pre class="mono">'+esc(JSON.stringify(fx,null,2))+'</pre>';
}
function table(cols,rows){
  return `<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
}

function fiducialTable(fids){
  if(!fids||!fids.length) return '';
  return `<div class="section-lab">Fiducials · ${fids.length}</div>`+
    table(['ID','Purpose','Chiral','Note'],
      fids.map(f=>`<tr><td class="cid">${esc(f.id)}</td><td>${esc(f.purpose)}</td>
        <td>${f.is_chiral_marker?'<span class="pill chiral">R · chiral</span>':'<span class="pill">—</span>'}</td>
        <td class="dim">${esc(splitContext(f.context).prose||'—')}</td></tr>`).join(''));
}
function protocolBlock(p){
  if(!p) return '';
  const rows=(p.series||[]).map(s=>`<tr><td class="cid">${esc(s.name)}</td>
    <td class="mono dim">${esc(s.voxel_mm||'—')}</td>
    <td class="num">${s.tr_ms??'—'}${s.te_ms!=null?' / '+s.te_ms:''}${s.ti_ms!=null?' / '+s.ti_ms:''}</td>
    <td class="mono dim">${s.b_values&&s.b_values.length?esc(s.b_values.join('/')):'—'}${s.directions?' · '+s.directions+'dir':''}</td>
    <td class="num">${s.n_slices??'—'}${s.slice_thickness_mm!=null?' · '+s.slice_thickness_mm+'mm':''}</td></tr>`).join('');
  return `<div class="section-lab">Scan protocol · ${(p.series||[]).length} series</div>`+
    ctxBlock(p.context,{expect:false})+
    table(['Series','Voxel','TR/TE/TI ms','b / dir','Slices'],rows);
}

// --- disk detail ---
function renderDisk(d){
  const nfx=(d.test_regions||[]).reduce((a,r)=>a+(r.fixtures?.length||0),0);
  let html=`<div class="dhead"><h2>${esc(d.name)}</h2>
    ${d.optional?'<span class="opt">optional</span>':''}${srcTag(d.source)}</div>`;
  html+=`<div class="metrics">
    <span class="metric">stack ${d.stack_index} · ${esc(d.band)}</span>
    <span class="metric">${nfx} fixtures</span>
    <span class="metric">${(d.fiducials||[]).length} fiducials</span>
    ${(d.metrics_enabled||[]).map(m=>`<span class="metric">${esc(m)}</span>`).join('')}</div>`;
  if(d.material) html+=`<div class="mcard" style="margin-bottom:14px"><div class="t">Material</div><div class="v" style="font-family:var(--f-body);font-weight:400">${esc(d.material)}</div></div>`;
  html+=ctxBlock(d.context);

  html+=`<div class="tools"><input class="search" id="fxsearch" placeholder="filter fixtures by id…" autocomplete="off"></div>`;
  html+=`<div class="section-lab">Test regions · ${(d.test_regions||[]).length}</div>`;
  (d.test_regions||[]).forEach((r,i)=>{
    const n=r.fixtures?.length||0;
    const mism=(r.count!=null && r.count!==n);
    html+=`<div class="region${i===0?' open':''}">
      <button class="rhead"><span class="chev">▸</span>${esc(r.category)}
        <span class="rcount${mism?' warn':''}">${r.count!=null?r.count+' declared · ':''}${n} shown</span></button>
      <div class="rbody">
        ${ctxBlock(r.context)}
        ${r.grid_scheme?`<p class="dim mono" style="font-size:12px;margin:8px 0 0">${esc(r.grid_scheme)}</p>`:''}
        ${renderFixtures(r)}
      </div></div>`;
  });
  html+=fiducialTable(d.fiducials);
  html+=protocolBlock(d.protocol);

  const el=$('#detail'); el.innerHTML=html;
  el.querySelectorAll('.rhead').forEach(b=>b.onclick=()=>b.closest('.region').classList.toggle('open'));
  const sb=$('#fxsearch');
  sb.oninput=()=>{
    const q=sb.value.trim().toLowerCase();
    el.querySelectorAll('[data-id]').forEach(row=>{
      row.style.display = (!q || row.dataset.id.toLowerCase().includes(q))?'':'none';
    });
    if(q) el.querySelectorAll('.region').forEach(r=>r.classList.add('open'));
  };
}

// --- spine + header ---
function domeSVG(){
  return `<svg class="dome" width="188" height="34" viewBox="0 0 188 34" aria-hidden="true">
    <path d="M6 34 V20 C6 6 30 1 94 1 C158 1 182 6 182 20 V34 Z"
      fill="var(--panel)" stroke="var(--line2)" stroke-width="1"/>
    <line x1="94" y1="1" x2="94" y2="10" stroke="var(--line2)" stroke-width="1"/>
    <circle cx="94" cy="9" r="2.4" fill="none" stroke="var(--teal)" stroke-width="1.2"/></svg>`;
}
function buildSpine(disks){
  const stack=$('#stack');
  stack.innerHTML=domeSVG()+disks.map((d,i)=>{
    const nfx=(d.test_regions||[]).reduce((a,r)=>a+(r.fixtures?.length||0),0);
    return `<button class="seg" data-i="${i}">${esc(d.name.replace(' Diffusion Disk','').replace(' Disk',''))}
      ${d.optional?'<span class="opt">opt</span>':''}
      <span class="band">${esc(d.band)}</span><span class="n">${nfx}</span></button>`;
  }).join('')+`<div class="base"></div>`;
  stack.querySelectorAll('.seg').forEach(s=>s.onclick=()=>select(+s.dataset.i));
}
let DISKS=[];
function select(i){
  DISKS.forEach((_,j)=>$(`.seg[data-i="${j}"]`)?.classList.toggle('active',i===j));
  renderDisk(DISKS[i]);
  window.scrollTo({top:0,behavior:'smooth'});
}
function header(){
  $('#modelId').textContent=PHANTOM.model_id||'';
  $('#title').textContent=PHANTOM.name||'';
  $('#maker').textContent=PHANTOM.manufacturer||'';
  const nfx=(PHANTOM.disks||[]).reduce((a,d)=>a+(d.test_regions||[]).reduce((x,r)=>x+(r.fixtures?.length||0),0),0);
  const nfd=(PHANTOM.disks||[]).reduce((a,d)=>a+(d.fiducials||[]).length,0);
  $('#stats').innerHTML=`
    <span><b>${(PHANTOM.disks||[]).length}</b> disks</span>
    <span><b>${nfx}</b> fixtures</span>
    <span><b>${nfd}</b> fiducials</span>
    <span><b>${(PHANTOM.solutes||[]).length}</b> solutes</span>
    <span>${PHANTOM.temp_range_C?`${PHANTOM.temp_range_C[0]}–${PHANTOM.temp_range_C[1]}°C`:''}</span>`;
}

DISKS=(PHANTOM.disks||[]).slice().sort((a,b)=>a.stack_index-b.stack_index);
header(); buildSpine(DISKS); select(0);
</script>
</body>
