985", "unit": "1e-3 mm^2/s", "rel": "ADC = -ln(S/S0) / b", "tol": 0.05, "v": null, "note": ""}, {"id": "calc-053", "kind": "calc", "q": "Phase contrast MRA uses VENC = 150 cm/s. What velocity produces a 180 degree phase shift?", "ans": "150", "unit": "cm/s", "rel": "VENC is by definition the 180 deg velocity", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-054", "kind": "calc", "q": "A flow velocity of 300 cm/s is imaged with VENC = 150 cm/s. What apparent velocity results from aliasing?", "ans": "-150", "unit": "cm/s", "rel": "aliased v wraps by 2*VENC", "tol": 0.02, "v": null, "note": ""}, {"id": "calc-055", "kind": "calc", "q": "A 2D acquisition has 20 slices at TR = 600 ms. What is the maximum time available per slice?", "ans": "30", "unit": "ms", "rel": "t = TR / Nslices", "tol": 0.03, "v": null, "note": ""}]}, {"label": "bandwidth", "items": [{"id": "calc-036", "kind": "calc", "q": "A receiver bandwidth of +/-32 kHz is used with 256 readout samples. What is the bandwidth per pixel?", "ans": "250", "unit": "Hz", "rel": "BW/pixel = total BW / Nsamples", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-037", "kind": "calc", "q": "What is the dwell time for a 64 kHz total receiver bandwidth?", "ans": "15.625", "unit": "us", "rel": "dwell = 1 / BW", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-038", "kind": "calc", "q": "With a 64 kHz bandwidth and 256 samples, how long is the readout window?", "ans": "4", "unit": "ms", "rel": "T = Nsamples / BW", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-039", "kind": "calc", "q": "Fat-water separation is 224 Hz at 1.5 T. At 250 Hz per pixel, how many pixels is the chemical shift misregistration?", "ans": "0.896", "unit": "pixels", "rel": "shift = df / (BW per pixel)", "tol": 0.05, "v": null, "note": ""}, {"id": "calc-040", "kind": "calc", "q": "Halving the receiver bandwidth changes SNR by what factor?", "ans": "1.4142", "unit": "x", "rel": "SNR proportional to 1/sqrt(BW)", "tol": 0.03, "v": null, "note": ""}]}, {"label": "chemical shift", "items": [{"id": "calc-007", "kind": "calc", "q": "The fat-water chemical shift is 3.5 ppm. What is the frequency separation in Hz at 1.5 T?", "ans": "223.5292", "unit": "Hz", "rel": "df = ppm * f0(MHz)", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-008", "kind": "calc", "q": "What is the fat-water frequency separation at 3.0 T? (3.5 ppm)", "ans": "447.0585", "unit": "Hz", "rel": "df = ppm * f0(MHz)", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-009", "kind": "calc", "q": "NAA and creatine methyl protons differ by 1.0 ppm. What is their frequency separation at 1.5 T?", "ans": "63.8655", "unit": "Hz", "rel": "df = ppm * f0(MHz)", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-010", "kind": "calc", "q": "At 1.5 T, what is the shortest TE at which fat and water are back in phase? (3.5 ppm)", "ans": "4.4737", "unit": "ms", "rel": "TE = 1/df", "tol": 0.04, "v": null, "note": ""}, {"id": "calc-011", "kind": "calc", "q": "At 3.0 T, what is the shortest TE at which fat and water are opposed in phase? (3.5 ppm)", "ans": "1.1184", "unit": "ms", "rel": "TE = 1/(2*df)", "tol": 0.04, "v": null, "note": ""}]}, {"label": "geometry", "items": [{"id": "calc-012", "kind": "calc", "q": "An image has a 24 cm FOV and a 256 x 256 matrix. What is the in-plane pixel size?", "ans": "0.9375", "unit": "mm", "rel": "pixel = FOV / matrix", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-013", "kind": "calc", "q": "A 25 x 25 cm FOV image uses 192 phase-encoding steps. What is the pixel dimension in the phase-encoding direction?", "ans": "1.3021", "unit": "mm", "rel": "pixel = FOV / steps", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-014", "kind": "calc", "q": "A 25 x 25 cm FOV image uses 512 samples in the frequency direction. What is the pixel dimension in that direction?", "ans": "0.4883", "unit": "mm", "rel": "pixel = FOV / samples", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-015", "kind": "calc", "q": "A 24 cm FOV, 256 x 256 image is acquired with 5 mm slices. What is the voxel volume?", "ans": "4.3945", "unit": "mm^3", "rel": "V = dx * dy * thickness", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-016", "kind": "calc", "q": "What matrix size gives 1.0 mm pixels over a 20 cm FOV?", "ans": "200", "unit": "unitless", "rel": "matrix = FOV / pixel", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-017", "kind": "calc", "q": "A 3D slab is 120 mm thick and divided into 60 partitions. What is the partition thickness?", "ans": "2", "unit": "mm", "rel": "thickness = slab / partitions", "tol": 0.03, "v": null, "note": ""}]}, {"label": "gradients", "items": [{"id": "calc-024", "kind": "calc", "q": "A readout gradient of 10 mT/m is applied across a 25 cm FOV. What is the total frequency spread across the FOV?", "ans": "106,442.5", "unit": "Hz", "rel": "df = (gamma/2pi) * G * FOV", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-025", "kind": "calc", "q": "An RF pulse of 1000 Hz bandwidth is applied with a 10 mT/m slice-select gradient. What is the slice thickness?", "ans": "2.3487", "unit": "mm", "rel": "dz = BW / ((gamma/2pi) * G)", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-026", "kind": "calc", "q": "A gradient reaches 20 mT/m at a slew rate of 200 T/m/s. What is the rise time?", "ans": "100", "unit": "us", "rel": "t = G / slew", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-027", "kind": "calc", "q": "A 100 kHz receiver bandwidth is used with a 10 mT/m readout gradient. What FOV does this encode?", "ans": "23.4869", "unit": "cm", "rel": "FOV = BW / ((gamma/2pi) * G)", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-028", "kind": "calc", "q": "What readout gradient encodes a 40 cm FOV with a 128 kHz bandwidth?", "ans": "7.5158", "unit": "mT/m", "rel": "G = BW / ((gamma/2pi) * FOV)", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-029", "kind": "calc", "q": "To halve the slice thickness at fixed RF bandwidth, by what factor must the slice-select gradient change?", "ans": "2", "unit": "x", "rel": "dz inversely proportional to G", "tol": 0.03, "v": null, "note": ""}]}, {"label": "larmor", "items": [{"id": "calc-001", "kind": "calc", "q": "What is the 1H resonance frequency at 3.0 T?", "ans": "127.731", "unit": "MHz", "rel": "f = (gamma/2pi) * B0", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-002", "kind": "calc", "q": "If the 1H resonance frequency at 1.5 T is 63.87 MHz, what is it at 7 T?", "ans": "298.06", "unit": "MHz", "rel": "f scales linearly with B0", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-003", "kind": "calc", "q": "What magnetic field strength gives a 1H resonance frequency of 100 MHz?", "ans": "2.3487", "unit": "T", "rel": "B0 = f / (gamma/2pi)", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-004", "kind": "calc", "q": "What is the period of one 1H precession cycle at 1.5 T?", "ans": "15.6579", "unit": "ns", "rel": "T = 1/f", "tol": 0.04, "v": null, "note": ""}, {"id": "calc-005", "kind": "calc", "q": "What is the 31P resonance frequency at 1.5 T? (gamma/2pi = 17.235 MHz/T)", "ans": "25.8525", "unit": "MHz", "rel": "f = (gamma/2pi) * B0", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-006", "kind": "calc", "q": "What is the 13C resonance frequency at 3.0 T? (gamma/2pi = 10.708 MHz/T)", "ans": "32.124", "unit": "MHz", "rel": "f = (gamma/2pi) * B0", "tol": 0.03, "v": null, "note": ""}]}, {"label": "relaxation", "items": [{"id": "calc-030", "kind": "calc", "q": "A tissue has T1 = 1000 ms. What percentage of longitudinal magnetization has recovered 1000 ms after a 90 degree pulse?", "ans": "63.2121", "unit": "%", "rel": "Mz = M0 (1 - exp(-t/T1))", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-031", "kind": "calc", "q": "What inversion time nulls fat with T1 = 250 ms?", "ans": "173.2868", "unit": "ms", "rel": "TI = T1 * ln2", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-032", "kind": "calc", "q": "What inversion time nulls CSF with T1 = 4000 ms?", "ans": "2,772.6", "unit": "ms", "rel": "TI = T1 * ln2", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-033", "kind": "calc", "q": "A tissue has T2 = 80 ms. What percentage of transverse magnetization remains at TE = 80 ms?", "ans": "36.7879", "unit": "%", "rel": "Mxy = M0 exp(-TE/T2)", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-034", "kind": "calc", "q": "What is the Ernst angle for TR = 30 ms and T1 = 900 ms?", "ans": "14.7117", "unit": "degrees", "rel": "cos(theta) = exp(-TR/T1)", "tol": 0.05, "v": null, "note": ""}, {"id": "calc-035", "kind": "calc", "q": "A tissue has T2 = 100 ms and T2' contributions give T2* = 50 ms. What is the T2' component?", "ans": "100", "unit": "ms", "rel": "1/T2* = 1/T2 + 1/T2'", "tol": 0.03, "v": null, "note": ""}]}, {"label": "safety", "items": [{"id": "calc-046", "kind": "calc", "q": "SAR scales with the square of B0. Moving a sequence from 1.5 T to 3.0 T changes SAR by what factor?", "ans": "4", "unit": "x", "rel": "SAR proportional to B0^2", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-047", "kind": "calc", "q": "SAR scales with the square of flip angle. Changing a 90 degree pulse to 180 degrees changes SAR by what factor?", "ans": "4", "unit": "x", "rel": "SAR proportional to alpha^2", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-048", "kind": "calc", "q": "What total RF power does a 70 kg patient absorb at the 2 W/kg whole-body normal-mode limit?", "ans": "140", "unit": "W", "rel": "P = SAR * mass", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-049", "kind": "calc", "q": "The 5 gauss line marks what field strength in millitesla?", "ans": "0.5", "unit": "mT", "rel": "1 T = 10000 G", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-050", "kind": "calc", "q": "Doubling the number of slices at fixed TR changes SAR by what factor?", "ans": "2", "unit": "x", "rel": "SAR proportional to pulses per TR", "tol": 0.03, "v": null, "note": ""}]}, {"label": "scan time", "items": [{"id": "calc-018", "kind": "calc", "q": "A spin echo sequence uses TR = 2000 ms, 256 phase-encoding steps and 1 average. What is the total scan time?", "ans": "512", "unit": "s", "rel": "T = TR * Nphase * NEX", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-019", "kind": "calc", "q": "TR = 500 ms, 192 phase-encoding steps, 2 averages. What is the scan time?", "ans": "192", "unit": "s", "rel": "T = TR * Nphase * NEX", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-020", "kind": "calc", "q": "A fast spin echo sequence uses TR = 4000 ms, 256 phase-encoding steps, echo train length 8, 1 average. What is the scan time?", "ans": "128", "unit": "s", "rel": "T = TR * Nphase * NEX / ETL", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-021", "kind": "calc", "q": "A 3D gradient echo uses TR = 25 ms, 192 phase-encoding steps, 64 partitions, 1 average. What is the scan time?", "ans": "307.2", "unit": "s", "rel": "T = TR * Nphase * Npartitions * NEX", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-022", "kind": "calc", "q": "TR = 3000 ms, 256 phase-encoding steps, 2 averages, with parallel imaging acceleration R = 2. What is the scan time?", "ans": "768", "unit": "s", "rel": "T = TR * Nphase * NEX / R", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-023", "kind": "calc", "q": "A single-shot EPI acquisition has an echo spacing of 0.8 ms and 128 phase-encoding steps. What is the total readout train duration?", "ans": "102.4", "unit": "ms", "rel": "T = echo spacing * Nphase", "tol": 0.03, "v": null, "note": ""}]}, {"label": "snr", "items": [{"id": "calc-041", "kind": "calc", "q": "Increasing the number of averages from 1 to 4 changes SNR by what factor?", "ans": "2", "unit": "x", "rel": "SNR proportional to sqrt(NEX)", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-042", "kind": "calc", "q": "Halving the voxel volume changes SNR by what factor?", "ans": "0.5", "unit": "x", "rel": "SNR proportional to voxel volume", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-043", "kind": "calc", "q": "Doubling the receiver bandwidth changes SNR by what factor?", "ans": "0.7071", "unit": "x", "rel": "SNR proportional to 1/sqrt(BW)", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-044", "kind": "calc", "q": "Parallel imaging at R = 4 with g = 1 changes SNR by what factor?", "ans": "0.5", "unit": "x", "rel": "SNR proportional to 1/(g*sqrt(R))", "tol": 0.03, "v": null, "note": ""}, {"id": "calc-045", "kind": "calc", "q": "How many averages are needed to double SNR?", "ans": "4", "unit": "unitless", "rel": "NEX = (SNR factor)^2", "tol": 0.03, "v": null, "note": ""}]}]}]}</script>
<script id="app">
(function(){
  var S = JSON.parse(document.getElementById('state').textContent);
  document.getElementById('mount').innerHTML =
    document.getElementById('shell').textContent.replace(/<\\\//g,'</');
  var root = document.getElementById('root');
  var canWrite = false, api = null, timer = null, dirty = false, dl = null;
  var WHO = S.expert || '';
  var LSKEY = S.key + (WHO ? '::' + WHO : '');

  var VERDICTS = {
    acr:  [['ok','senses look right'],['fx','shares/order wrong'],['no','a sense is missing or wrong']],
    calc: [['ok','question + answer ok'],['fx','answer wrong'],['no','question unfair']],
    q:    [['ok','good question'],['fx','needs rewording'],['no','drop it']],
    cal:  [['ok','grade is right'],['fx','too generous'],['no','too harsh']]
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function allItems(){
    var out=[]; S.sections.forEach(function(sec){
      sec.groups.forEach(function(g){ out = out.concat(g.items); }); });
    return out;
  }
  function counts(){ var a=allItems();
    return {done:a.filter(function(x){return x.v;}).length, total:a.length}; }
  function find(id){ var a=allItems();
    for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i];
    return null; }
  function cls(v){ return v==='ok'?'okd':v==='no'?'flag':v==='fx'?'fix':''; }

  function body(x){
    if (x.kind === 'acr') {
      var h = '<div class="acr">'+esc(x.a)+'</div>';
      (x.senses||[]).forEach(function(sn){
        if (sn.unseen) {
          h += '<div class="alt"><span class="lbl">also defined</span>'+esc(sn.exp)
             + ' <span style="color:var(--ink-3)">(not in the sampled passages)</span></div>';
        } else {
          h += '<div class="sense"><span class="lbl">'+Math.round(sn.share*100)+'%</span>'
             + esc(sn.exp)+'</div>';
          if (sn.cues && sn.cues.length)
            h += '<div class="freq" style="margin-top:2px">appears near: '
               + esc(sn.cues.join(', '))+'</div>';
        }
      });
      return h + '<div class="freq">'+x.n+' mentions across '+x.docs
           + ' documents &middot; '+x.sample+' passages sampled</div>';
    }
    if (x.kind === 'calc') {
      return '<span class="cat">'+esc(x.id)+'</span>'
           + '<div class="q">'+esc(x.q)+'</div>'
           + '<div class="ansline"><span class="val">'+esc(x.ans)+' '+esc(x.unit)+'</span>'
           + '<span class="rel">'+esc(x.rel)+'</span>'
           + '<span class="rel">tol &plusmn;'+Math.round(x.tol*100)+'%</span></div>';
    }
    if (x.kind === 'cal') {
      var GN = {'2':'a right page to consult','1':'useful supporting material',
                '0':'same area, would not help','-1':'unrelated'};
      var hc = '<span class="cat">machine grade '+esc(x.g)+' &middot; '+esc(GN[String(x.g)]||'')+'</span>';
      hc += '<div class="qt">'+esc(x.q)+'</div>';
      hc += '<div class="freq" style="margin-bottom:7px">document: '+esc(x.doc)+'</div>';
      hc += '<div class="q" style="font-size:14px;color:var(--ink-3)">'+esc(x.snip)+'…</div>';
      return hc;
    }
    var h2 = '<span class="cat">'+esc(x.id)+'</span>';
    if (x.title) h2 += '<div class="qt">'+esc(x.title)+'</div>';
    h2 += '<div class="q">'+esc(x.q)+'</div>';
    h2 += '<div class="freq">'+(x.npdf||0)+' linked source documents';
    if (x.flag) h2 += '  \u00b7  shares '+x.flag+' terms with the answer opening';
    h2 += '</div>';
    return h2;
  }

  function card(x){
    var defs = VERDICTS[x.kind] || VERDICTS.q;
    var b = defs.map(function(d){
      return '<button class="v '+d[0]+'" data-id="'+x.id+'" data-v="'+d[0]+'" aria-pressed="'
           + (x.v===d[0])+'">'+esc(d[1])+'</button>'; }).join('');
    return '<div class="item '+(x.v?'done ':'')+cls(x.v)+'" id="i-'+x.id+'">'
         + '<div>'+body(x)+'</div><div class="acts">'+b+'</div>'
         + '<textarea class="note" data-id="'+x.id+'" placeholder="correction or note (optional)">'
         + esc(x.note)+'</textarea></div>';
  }

  function render(){
    var tab = root.dataset.tab || S.sections[0].id;
    var c = counts(), pct = c.total ? Math.round(100*c.done/c.total) : 0;
    var h = '<div class="bar">';
    if (WHO) h += '<span class="who">reviewer <b>'+esc(WHO)+'</b></span>';
    if (S.sections.length > 1)
      S.sections.forEach(function(sec){
        var n=0; sec.groups.forEach(function(g){ n+=g.items.length; });
        h += '<button class="tab" data-tab="'+sec.id+'" aria-selected="'+(tab===sec.id)+'">'
           + esc(sec.title)+' ('+n+')</button>'; });
    h += '<div class="prog"><span>'+c.done+' / '+c.total+' reviewed</span>'
       + '<span class="pbar"><span class="pfill" style="width:'+pct+'%"></span></span>'
       + '<button class="tab exp" data-act="export">export my answers</button>'
       + '</div></div>';
    if (root.dataset.exp === '1') h += panel();
    S.sections.forEach(function(sec){
      if (sec.id !== tab) return;
      h += '<section><h2>'+esc(sec.heading)+'</h2><p class="sub">'+sec.sub+'</p>';
      sec.groups.forEach(function(g){
        if (g.label) h += '<div class="grp">'+esc(g.label)+' &middot; '+g.items.length+'</div>';
        g.items.forEach(function(x){ h += card(x); }); });
      h += '</section>';
    });
    root.innerHTML = h;
  }

  root.addEventListener('click', function(e){
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.act === 'export') { doExport(); return; }
    if (t.dataset.act === 'copy') {
      var ta = document.getElementById('expjson');
      if (ta) { ta.focus(); ta.select();
        try { document.execCommand('copy'); t.textContent = 'copied'; } catch(_){} }
      return;
    }
    if (t.dataset.act === 'closepanel') { root.dataset.exp='0'; render(); return; }
    if (t.classList.contains('tab')) { root.dataset.tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
    if (!t.classList.contains('v')) return;
    var x = find(t.dataset.id); if (!x) return;
    x.v = (x.v === t.dataset.v) ? null : t.dataset.v;
    var card = document.getElementById('i-'+x.id);
    if (card) {
      card.className = 'item ' + (x.v?'done ':'') + cls(x.v);
      card.querySelectorAll('button.v').forEach(function(b){
        b.setAttribute('aria-pressed', String(x.v === b.dataset.v)); });
    }
    var c = counts();
    var pf=document.querySelector('.pfill'), pt=document.querySelector('.prog span');
    if (pf) pf.style.width = (c.total?Math.round(100*c.done/c.total):0)+'%';
    if (pt) pt.textContent = c.done+' / '+c.total+' reviewed';
    schedule();
  });

  root.addEventListener('input', function(e){
    if (!e.target.classList.contains('note')) return;
    var x = find(e.target.dataset.id); if (!x) return;
    x.note = e.target.value; schedule();
  });

  function payload(){
    var done = allItems().filter(function(x){ return x.v || (x.note||'').trim(); })
      .map(function(x){ return {id:x.id, kind:x.kind, v:x.v||null,
                                note:(x.note||'').trim()}; });
    return JSON.stringify({schema:'mriq-review/1', page:S.key, title:S.title,
      expert:WHO || null, version:S.version|0,
      n_items:counts().total, n_answered:done.length, answers:done}, null, 1);
  }

  function fname(){
    var who = (WHO || 'anonymous').toLowerCase().replace(/[^a-z0-9]+/g,'-')
      .replace(/^-|-$/g,'') || 'anonymous';
    return S.key + '--' + who + '.json';
  }

  function panel(){
    var c = counts();
    return '<div class="expanel"><h3>Send these answers back</h3>'
      + '<p>' + c.done + ' of ' + c.total + ' items answered. If the download did not '
      + 'start, copy the text below into a file named <code>' + esc(fname()) + '</code> '
      + 'and send it back. Nothing here is lost by closing the tab.</p>'
      + '<textarea id="expjson" readonly spellcheck="false">' + esc(payload()) + '</textarea>'
      + '<div style="display:flex;gap:9px;margin-top:9px">'
      + '<button class="tab" data-act="copy">copy to clipboard</button>'
      + '<button class="tab" data-act="closepanel">close</button></div></div>';
  }

  function saveViaBlob(){
    try {
      var url = URL.createObjectURL(new Blob([payload()], {type:'application/json'}));
      var a = document.createElement('a');
      a.href = url; a.download = fname();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      setStatus('answers exported as ' + fname());
    } catch(_) { setStatus('download unavailable \u2014 copy the text below instead'); }
  }

  function doExport(){
    root.dataset.exp = '1'; render(); window.scrollTo(0,0);
    if (!dl) { saveViaBlob(); return; }
    dl.save({filename: fname(), data: payload()})
      .then(function(){ setStatus('answers exported as ' + fname()); })
      .catch(function(err){
        var c = err && err.code;
        if (c === 'declined' || c === 'rate_limited') return;
        setStatus('download unavailable — copy the text below instead');
      });
  }

  function schedule(){
    dirty = true;
    try { localStorage.setItem(LSKEY, JSON.stringify(allItems().map(function(x){
      return {id:x.id, v:x.v, note:x.note}; }))); } catch(_){}
    if (!canWrite) { setStatus(null); return; }
    setStatus('saving…');
    clearTimeout(timer); timer = setTimeout(save, 1800);
  }

  function buildDoc(){
    S.version = (S.version|0) + 1;
    return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width,initial-scale=1">'
      + '<title>' + S.title + '</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com">'
      + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600'
      + '&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap">'
      + '<style id="css">' + document.getElementById('css').textContent + '</style></head><body>'
      + '<script id="shell" type="text/template">'
      + document.getElementById('shell').textContent.replace(/<\//g,'<\\/') + '<\/script>'
      + '<div class="wrap" id="mount"></div>'
      + '<script id="state" type="application/json">'
      + JSON.stringify(S).replace(/<\//g,'<\\/') + '<\/script>'
      + '<script id="app">' + document.getElementById('app').textContent + '<\/script>'
      + '</body></html>';
  }

  function save(){
    if (!api || !dirty) return;
    api.publish(buildDoc()).then(function(){ dirty=false; setStatus('saved'); })
      .catch(function(err){
        var c = err && err.code;
        if (c === 'conflict') setStatus('someone else saved first — reloading to their version');
        else if (c === 'not_granted' || c === 'not_writer') { canWrite=false; setStatus(null); }
        else setStatus('could not save — your work is kept in this browser');
      });
  }

  function setStatus(msg){
    var el = document.getElementById('sbar'); if (!el) return;
    if (msg) { el.className='status ok'; el.innerHTML='<b>'+esc(msg)+'</b>'; return; }
    var who = WHO ? ' This copy belongs to <b>'+esc(WHO)+'</b>.' : '';
    if (canWrite) { el.className='status ok';
      el.innerHTML='<b>Saving is on.</b> Answers are written back into this page as you go, so '
        +'they survive closing the tab.'+who+' When you finish, press '
        +'<b>export my answers</b> as well &mdash; that is the copy we load into the system.'; }
    else { el.className='status ro';
      el.innerHTML='<b>Read-only &mdash; nothing is being saved back to us.</b> Your answers are '
        +'kept in this browser alone and we cannot see them.'+who+' Work through the list, then '
        +'press <b>export my answers</b> and send us the file. That is the only way your work '
        +'reaches us.'; }
  }

  try {
    var raw = localStorage.getItem(LSKEY);
    if (raw) { var by={}; JSON.parse(raw).forEach(function(o){ by[o.id]=o; });
      allItems().forEach(function(x){ var o=by[x.id];
        if (o && !x.v && (o.v || o.note)) { x.v=o.v; x.note=o.note; } }); }
  } catch(_){}

  root.dataset.tab = S.sections[0].id;
  render(); setStatus(null);

  if (window.claude && claude.use) {
    claude.use('artifact').then(function(a){
      if (!a) return; api=a; canWrite=true; setStatus(null);
    }).catch(function(){});
    claude.use('downloads').then(function(d){ if (d) dl=d; }).catch(function(){});
  }
})();
</script>


</body>
</html>
