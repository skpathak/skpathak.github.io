<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Held-Out Test Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
  :root{color-scheme:light dark}
  body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<style id="css">
:root{--ground:#FBFCFD;--surface:#F1F4F7;--surface-2:#E8EDF2;--ink:#12181D;--ink-2:#3D4A56;
--ink-3:#6B7885;--rule:#DBE2E8;--rule-2:#C3CDD6;--accent:#0B6E8C;--accent-soft:#E1EFF4;
--neg:#A6412F;--neg-soft:#F6E7E3;--pos:#2F6B4F;--pos-soft:#E4EFE9;--warn:#8A6414;
--warn-soft:#F6EEDC;--serif:"IBM Plex Serif",Georgia,serif;
--sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0D1116;--surface:#161C23;
--surface-2:#1E262F;--ink:#E6EBF0;--ink-2:#B3BEC9;--ink-3:#7F8C99;--rule:#26303A;--rule-2:#354350;
--accent:#4FB6D4;--accent-soft:#12303B;--neg:#E38070;--neg-soft:#331A15;--pos:#7CC3A0;
--pos-soft:#132920;--warn:#D6AC5B;--warn-soft:#2C2312}}
:root[data-theme="dark"]{--ground:#0D1116;--surface:#161C23;--surface-2:#1E262F;--ink:#E6EBF0;
--ink-2:#B3BEC9;--ink-3:#7F8C99;--rule:#26303A;--rule-2:#354350;--accent:#4FB6D4;
--accent-soft:#12303B;--neg:#E38070;--neg-soft:#331A15;--pos:#7CC3A0;--pos-soft:#132920;
--warn:#D6AC5B;--warn-soft:#2C2312}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;
line-height:1.55;margin:0;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px 100px}
header.top{padding:60px 0 30px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
color:var(--accent);font-weight:600;margin:0 0 16px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.1rem,5vw,3.2rem);line-height:1.05;
letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
.standfirst{font-family:var(--serif);font-size:1.1rem;line-height:1.5;color:var(--ink-2);
max-width:60ch;margin:0 0 8px}
.status{margin:22px 0 0;padding:13px 16px;border:1px solid var(--rule);border-radius:4px;
background:var(--surface);font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.status b{color:var(--ink-2);font-weight:500}
.status.ok{border-left:3px solid var(--pos)}
.status.ro{border-left:3px solid var(--warn);background:var(--warn-soft)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:20;
background:var(--ground);border-bottom:1px solid var(--rule);padding:14px 0;margin-bottom:8px}
.tab{font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:7px 14px;border-radius:3px;
border:1px solid var(--rule-2);background:var(--surface);color:var(--ink-2);cursor:pointer;
font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:hover{border-color:var(--accent)}
.prog{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3);
display:flex;gap:14px;align-items:center}
.tab.exp{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.who{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
color:var(--ink-3);font-weight:600;padding:7px 0 7px 2px}
.who b{color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:none;
font-size:12.5px}
.expanel{border:1px solid var(--accent);border-radius:4px;background:var(--surface);
padding:15px 17px;margin:0 0 14px}
.expanel h3{font-family:var(--sans);font-size:14px;font-weight:600;margin:0 0 6px;color:var(--ink)}
.expanel p{font-size:13px;color:var(--ink-2);margin:0 0 10px;max-width:70ch}
.expanel textarea{width:100%;height:150px;font-family:var(--mono);font-size:11px;line-height:1.45;
padding:9px 11px;border:1px solid var(--rule-2);border-radius:3px;background:var(--ground);
color:var(--ink);resize:vertical}
.pbar{width:120px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--accent);width:0%;transition:width .25s}
section h2{font-family:var(--serif);font-size:1.5rem;margin:34px 0 6px;letter-spacing:-.01em}
section .sub{color:var(--ink-3);font-size:14px;max-width:66ch;margin:0 0 20px}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
color:var(--ink-3);font-weight:600;margin:30px 0 10px;padding-bottom:7px;
border-bottom:1px solid var(--rule)}
.item{border:1px solid var(--rule);border-radius:4px;background:var(--surface);padding:15px 17px;
margin-bottom:9px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.item.done{background:var(--ground)}
.item.flag{border-left:3px solid var(--neg)}
.item.okd{border-left:3px solid var(--pos)}
.item.fix{border-left:3px solid var(--warn)}
@media(max-width:700px){.item{grid-template-columns:1fr}}
.acr{font-family:var(--mono);font-size:1.15rem;font-weight:600;color:var(--accent);margin-bottom:5px}
.sense{font-size:15px;color:var(--ink);margin-bottom:3px}
.sense .lbl,.alt .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
text-transform:uppercase;margin-right:8px}
.sense .lbl{color:var(--ink-3)}
.alt{font-size:14px;color:var(--ink-2)}
.alt .lbl{color:var(--neg)}
.freq{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:7px}
.q{font-size:15px;color:var(--ink);line-height:1.5;margin-bottom:9px;max-width:70ch}
.qt{font-family:var(--serif);font-size:1.05rem;color:var(--ink);margin-bottom:7px;font-weight:600}
.ansline{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;font-family:var(--mono);
font-size:13px}
.ansline .val{color:var(--pos);font-weight:600;font-size:14.5px}
.ansline .rel{color:var(--ink-3);font-size:12px}
.cat{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--surface-2);
color:var(--ink-3);font-weight:600;margin-bottom:7px}
.acts{display:flex;flex-direction:column;gap:6px;min-width:140px}
@media(max-width:700px){.acts{flex-direction:row;flex-wrap:wrap;min-width:0}}
button.v{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:7px 11px;
border-radius:3px;border:1px solid var(--rule-2);background:var(--ground);color:var(--ink-2);
cursor:pointer;text-align:left;font-weight:500;white-space:nowrap}
button.v:hover{border-color:var(--accent);color:var(--accent)}
button.v[aria-pressed="true"]{font-weight:600}
button.v.ok[aria-pressed="true"]{background:var(--pos-soft);border-color:var(--pos);color:var(--pos)}
button.v.no[aria-pressed="true"]{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
button.v.fx[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
textarea.note{grid-column:1/-1;width:100%;font-family:var(--sans);font-size:13.5px;padding:9px 11px;
border:1px solid var(--rule-2);border-radius:3px;background:var(--ground);color:var(--ink);
resize:vertical;min-height:38px;margin-top:2px}
textarea.note:focus{outline:2px solid var(--accent);outline-offset:1px}
footer{margin-top:60px;padding-top:30px;border-top:2px solid var(--ink)}
footer p{font-size:13px;color:var(--ink-3);max-width:66ch}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<\/footer></script>

nce evaluations are performed periodically by a qualified medical physicist, MR scientist, qualified expert, or service engineer. For ACR-accredited MRI units, a continuous QC program must be implemented, and technologist QC testing is required", "v": null, "note": ""}, {"id": "cal-07", "kind": "cal", "q": "Which of the following \u00b9H-containing molecules account for nearly 100% of the signal recorded within the brain parenchyma using routine MRI sequences?", "doc": "uploads/3/4/5/7/34572113/naa_-whole_paper_ihms19724.pdf", "g": 0, "snip": "N-Acetylaspartate in the CNS: From Neurodiagnostics to Neurobiology John R. Moffett1,2, Brian Ross3, Peethambaran Arun1, Chikkathur N. Madhavarao1, and M. A. A. Namboodiri1 1 Department of Anatomy, Physiology and Genetics, Uniformed Services University of the Health Sciences, Building C, 4301 Jones Bridge Rd., Bethesda, MD 20814, USA 3 Magnetic Resonance Unit, Huntington Medical Research Institutes, Pasadena, CA; Rudi Schulte Research Institute, Santa Barbara CA and NARSAD Abstract The brain is", "v": null, "note": ""}, {"id": "cal-08", "kind": "cal", "q": "Concerning magnetophosphenes, which statement is false?", "doc": "uploads/3/4/5/7/34572113/acr_manual_on_mr_safety__2000_.pdf", "g": 2, "snip": "0 ACR Manual on MR Safety 2020 ACR COMMITTEE ON MR SAFETY AMERICAN COLLEGE OF RADIOLOGY | 1891 Preston White Drive, Reston, VA 20191 1 ACR Manual on MR Safety Version 1.0 2020 ACR Committee on MR Safety 2 CONTENTS ACKNOWLEDGMENTS .............................................................................................................. 3 Preface............................................................................................................................................. 4 Revisions ......................................................................................................................................... 5 Introduction .................................................................................... re superconductor", "q": "Could high-temperature superconductors be used in future magnet construction?", "npdf": 4, "flag": 0, "v": null, "note": ""}, {"id": "routine-quality-control", "kind": "q", "title": "Routine Quality Control", "q": "What routine quality control testing must be carried out on a clinical scanner?", "npdf": 2, "flag": 0, "v": null, "note": ""}, {"id": "samer", "kind": "q", "title": "SAMER", "q": "How does the SAMER method correct for patient motion retrospectively?", "npdf": 2, "flag": 0, "v": null, "note": ""}, {"id": "what-is-sar", "kind": "q", "title": "Specific Absorption Rate", "q": "What does specific absorption rate quantify?", "npdf": 9, "flag": 0, "v": null, "note": ""}, {"id": "spin-density-h-effects", "kind": "q", "title": "Spin density", "q": "What does spin density mean, and how does it influence image contrast?", "npdf": 7, "flag": 0, "v": null, "note": ""}, {"id": "spin-phase-effects", "kind": "q", "title": "Spin phase effects?", "q": "What are spin-phase effects, and why do they matter for moving spins?", "npdf": 2, "flag": 0, "v": null, "note": ""}, {"id": "what-is-spin", "kind": "q", "title": "Spin What is spin?", "q": "What is nuclear spin?", "npdf": 1, "flag": 0, "v": null, "note": ""}, {"id": "spirspair-v-stir", "kind": "q", "title": "SPIR/SPAIR v STIR", "q": "How do spectrally selective inversion techniques differ from STIR, and when is each appropriate?", "npdf": 4, "flag": 0, "v": null, "note": ""}, {"id": "cine-parameters", "kind": "q", "title": "SSFP Cardiac cine", "q": "How should imaging parameters be selected for a cardiac cine acquisition?", "npdf": 4, "flag": 0, "v": null, "note": ""}, {"id": "subarachnoid-blood", "kind": "q", "title": "Subarachnoid hemorrhage MRI", "q": "Why does subarachnoid blood evolve differently from a hematoma within the brain parenchyma?", "npdf": 6, "flag": 0, "v": null, "note": ""}, {"id": "phase-of-blood-v-ca", "kind": "q", "title": "Susceptibility phase", "q": "How can calcification be told apart from blood products on susceptibility phase images?", "npdf": 6, "flag": 0, "v": null, "note": ""}, {"id": "t1-rho", "kind": "q", "title": "T1-rho (T1\u03c1)", "q": "What does T1-rho measure, and how does it differ from T1 and T2?", "npdf": 5, "flag": 0, "v": null, "note": ""}, {"id": "what-does-k-stand-for", "kind": "q", "title": "The Meaning of \"", "q": "Why is the letter k used to denote spatial frequency?", "npdf": 0, "flag": 0, "v": null, "note": ""}, {"id": "what-is-k-space", "kind": "q", "title": "To many students, k-space seems frightening and mysterious. It doesn't have to be. At its corek-space can be defined in", "q": "What is k-space, in simple terms?", "npdf": 7, "flag": 0, "v": null, "note": ""}, {"id": "transmitter-gain", "kind": "q", "title": "Transmitter gain", "q": "What is achieved by adjusting transmitter gain during prescan?", "npdf": 3, "flag": 0, "v": null, "note": ""}, {"id": "need-for-vibration-testing", "kind": "q", "title": "Vibration testing", "q": "Why is vibration testing required before installing a new scanner?", "npdf": 2, "flag": 0, "v": null, "note": ""}, {"id": "whyhow-stress-test", "kind": "q", "title": "Why/How Stress Test Why would you want to do a stress MRI? How is it performed?", "q": "Why and how is a stress cardiac MRI performed?", "npdf": 4, "flag": 0, "v": null, "note": ""}, {"id": "how-to-sup3sup1p-mrs", "kind": "q", "title": "\u00b3\u00b9P MRS Technique", "q": "What hardware and technique changes are needed to perform phosphorus rather than proton spectroscopy?", "npdf": 3, "flag": 0, "v": null, "note": ""}, {"id": "effect-of-a-minus90deg-pulse", "kind": "q", "title": "\u221290\u00b0 RF pulse", "q": "Can applying an inverted 90\u00b0 pulse undo the effect of the original excitation?", "npdf": 1, "flag": 0, "v": null, "note": ""}]}]}]}</script>
<script id="app">
(function(){
  var S = JSON.parse(document.getElementById('state').textContent);
  document.getElementById('mount').innerHTML =
    document.getElementById('shell').textContent.replace(/<\\\//g,'</');
  var root = document.getElementById('root');
  var canWrite = false, api = null, timer = null, dirty = false, dl = null;
  var WHO = S.expert || '';
  var LSKEY = S.key + (WHO ? '::' + WHO : '');

  var VERDICTS = {
    acr:  [['ok','senses look right'],['fx','shares/order wrong'],['no','a sense is missing or wrong']],
    calc: [['ok','question + answer ok'],['fx','answer wrong'],['no','question unfair']],
    q:    [['ok','good question'],['fx','needs rewording'],['no','drop it']],
    cal:  [['ok','grade is right'],['fx','too generous'],['no','too harsh']]
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function allItems(){
    var out=[]; S.sections.forEach(function(sec){
      sec.groups.forEach(function(g){ out = out.concat(g.items); }); });
    return out;
  }
  function counts(){ var a=allItems();
    return {done:a.filter(function(x){return x.v;}).length, total:a.length}; }
  function find(id){ var a=allItems();
    for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i];
    return null; }
  function cls(v){ return v==='ok'?'okd':v==='no'?'flag':v==='fx'?'fix':''; }

  function body(x){
    if (x.kind === 'acr') {
      var h = '<div class="acr">'+esc(x.a)+'</div>';
      (x.senses||[]).forEach(function(sn){
        if (sn.unseen) {
          h += '<div class="alt"><span class="lbl">also defined</span>'+esc(sn.exp)
             + ' <span style="color:var(--ink-3)">(not in the sampled passages)</span></div>';
        } else {
          h += '<div class="sense"><span class="lbl">'+Math.round(sn.share*100)+'%</span>'
             + esc(sn.exp)+'</div>';
          if (sn.cues && sn.cues.length)
            h += '<div class="freq" style="margin-top:2px">appears near: '
               + esc(sn.cues.join(', '))+'</div>';
        }
      });
      return h + '<div class="freq">'+x.n+' mentions across '+x.docs
           + ' documents &middot; '+x.sample+' passages sampled</div>';
    }
    if (x.kind === 'calc') {
      return '<span class="cat">'+esc(x.id)+'</span>'
           + '<div class="q">'+esc(x.q)+'</div>'
           + '<div class="ansline"><span class="val">'+esc(x.ans)+' '+esc(x.unit)+'</span>'
           + '<span class="rel">'+esc(x.rel)+'</span>'
           + '<span class="rel">tol &plusmn;'+Math.round(x.tol*100)+'%</span></div>';
    }
    if (x.kind === 'cal') {
      var GN = {'2':'a right page to consult','1':'useful supporting material',
                '0':'same area, would not help','-1':'unrelated'};
      var hc = '<span class="cat">machine grade '+esc(x.g)+' &middot; '+esc(GN[String(x.g)]||'')+'</span>';
      hc += '<div class="qt">'+esc(x.q)+'</div>';
      hc += '<div class="freq" style="margin-bottom:7px">document: '+esc(x.doc)+'</div>';
      hc += '<div class="q" style="font-size:14px;color:var(--ink-3)">'+esc(x.snip)+'…</div>';
      return hc;
    }
    var h2 = '<span class="cat">'+esc(x.id)+'</span>';
    if (x.title) h2 += '<div class="qt">'+esc(x.title)+'</div>';
    h2 += '<div class="q">'+esc(x.q)+'</div>';
    h2 += '<div class="freq">'+(x.npdf||0)+' linked source documents';
    if (x.flag) h2 += '  \u00b7  shares '+x.flag+' terms with the answer opening';
    h2 += '</div>';
    return h2;
  }

  function card(x){
    var defs = VERDICTS[x.kind] || VERDICTS.q;
    var b = defs.map(function(d){
      return '<button class="v '+d[0]+'" data-id="'+x.id+'" data-v="'+d[0]+'" aria-pressed="'
           + (x.v===d[0])+'">'+esc(d[1])+'</button>'; }).join('');
    return '<div class="item '+(x.v?'done ':'')+cls(x.v)+'" id="i-'+x.id+'">'
         + '<div>'+body(x)+'</div><div class="acts">'+b+'</div>'
         + '<textarea class="note" data-id="'+x.id+'" placeholder="correction or note (optional)">'
         + esc(x.note)+'</textarea></div>';
  }

  function render(){
    var tab = root.dataset.tab || S.sections[0].id;
    var c = counts(), pct = c.total ? Math.round(100*c.done/c.total) : 0;
    var h = '<div class="bar">';
    if (WHO) h += '<span class="who">reviewer <b>'+esc(WHO)+'</b></span>';
    if (S.sections.length > 1)
      S.sections.forEach(function(sec){
        var n=0; sec.groups.forEach(function(g){ n+=g.items.length; });
        h += '<button class="tab" data-tab="'+sec.id+'" aria-selected="'+(tab===sec.id)+'">'
           + esc(sec.title)+' ('+n+')</button>'; });
    h += '<div class="prog"><span>'+c.done+' / '+c.total+' reviewed</span>'
       + '<span class="pbar"><span class="pfill" style="width:'+pct+'%"></span></span>'
       + '<button class="tab exp" data-act="export">export my answers</button>'
       + '</div></div>';
    if (root.dataset.exp === '1') h += panel();
    S.sections.forEach(function(sec){
      if (sec.id !== tab) return;
      h += '<section><h2>'+esc(sec.heading)+'</h2><p class="sub">'+sec.sub+'</p>';
      sec.groups.forEach(function(g){
        if (g.label) h += '<div class="grp">'+esc(g.label)+' &middot; '+g.items.length+'</div>';
        g.items.forEach(function(x){ h += card(x); }); });
      h += '</section>';
    });
    root.innerHTML = h;
  }

  root.addEventListener('click', function(e){
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.act === 'export') { doExport(); return; }
    if (t.dataset.act === 'copy') {
      var ta = document.getElementById('expjson');
      if (ta) { ta.focus(); ta.select();
        try { document.execCommand('copy'); t.textContent = 'copied'; } catch(_){} }
      return;
    }
    if (t.dataset.act === 'closepanel') { root.dataset.exp='0'; render(); return; }
    if (t.classList.contains('tab')) { root.dataset.tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
    if (!t.classList.contains('v')) return;
    var x = find(t.dataset.id); if (!x) return;
    x.v = (x.v === t.dataset.v) ? null : t.dataset.v;
    var card = document.getElementById('i-'+x.id);
    if (card) {
      card.className = 'item ' + (x.v?'done ':'') + cls(x.v);
      card.querySelectorAll('button.v').forEach(function(b){
        b.setAttribute('aria-pressed', String(x.v === b.dataset.v)); });
    }
    var c = counts();
    var pf=document.querySelector('.pfill'), pt=document.querySelector('.prog span');
    if (pf) pf.style.width = (c.total?Math.round(100*c.done/c.total):0)+'%';
    if (pt) pt.textContent = c.done+' / '+c.total+' reviewed';
    schedule();
  });

  root.addEventListener('input', function(e){
    if (!e.target.classList.contains('note')) return;
    var x = find(e.target.dataset.id); if (!x) return;
    x.note = e.target.value; schedule();
  });

  function payload(){
    var done = allItems().filter(function(x){ return x.v || (x.note||'').trim(); })
      .map(function(x){ return {id:x.id, kind:x.kind, v:x.v||null,
                                note:(x.note||'').trim()}; });
    return JSON.stringify({schema:'mriq-review/1', page:S.key, title:S.title,
      expert:WHO || null, version:S.version|0,
      n_items:counts().total, n_answered:done.length, answers:done}, null, 1);
  }

  function fname(){
    var who = (WHO || 'anonymous').toLowerCase().replace(/[^a-z0-9]+/g,'-')
      .replace(/^-|-$/g,'') || 'anonymous';
    return S.key + '--' + who + '.json';
  }

  function panel(){
    var c = counts();
    return '<div class="expanel"><h3>Send these answers back</h3>'
      + '<p>' + c.done + ' of ' + c.total + ' items answered. If the download did not '
      + 'start, copy the text below into a file named <code>' + esc(fname()) + '</code> '
      + 'and send it back. Nothing here is lost by closing the tab.</p>'
      + '<textarea id="expjson" readonly spellcheck="false">' + esc(payload()) + '</textarea>'
      + '<div style="display:flex;gap:9px;margin-top:9px">'
      + '<button class="tab" data-act="copy">copy to clipboard</button>'
      + '<button class="tab" data-act="closepanel">close</button></div></div>';
  }

  function saveViaBlob(){
    try {
      var url = URL.createObjectURL(new Blob([payload()], {type:'application/json'}));
      var a = document.createElement('a');
      a.href = url; a.download = fname();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      setStatus('answers exported as ' + fname());
    } catch(_) { setStatus('download unavailable \u2014 copy the text below instead'); }
  }

  function doExport(){
    root.dataset.exp = '1'; render(); window.scrollTo(0,0);
    if (!dl) { saveViaBlob(); return; }
    dl.save({filename: fname(), data: payload()})
      .then(function(){ setStatus('answers exported as ' + fname()); })
      .catch(function(err){
        var c = err && err.code;
        if (c === 'declined' || c === 'rate_limited') return;
        setStatus('download unavailable — copy the text below instead');
      });
  }

  function schedule(){
    dirty = true;
    try { localStorage.setItem(LSKEY, JSON.stringify(allItems().map(function(x){
      return {id:x.id, v:x.v, note:x.note}; }))); } catch(_){}
    if (!canWrite) { setStatus(null); return; }
    setStatus('saving…');
    clearTimeout(timer); timer = setTimeout(save, 1800);
  }

  function buildDoc(){
    S.version = (S.version|0) + 1;
    return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width,initial-scale=1">'
      + '<title>' + S.title + '</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com">'
      + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600'
      + '&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap">'
      + '<style id="css">' + document.getElementById('css').textContent + '</style></head><body>'
      + '<script id="shell" type="text/template">'
      + document.getElementById('shell').textContent.replace(/<\//g,'<\\/') + '<\/script>'
      + '<div class="wrap" id="mount"></div>'
      + '<script id="state" type="application/json">'
      + JSON.stringify(S).replace(/<\//g,'<\\/') + '<\/script>'
      + '<script id="app">' + document.getElementById('app').textContent + '<\/script>'
      + '</body></html>';
  }

  function save(){
    if (!api || !dirty) return;
    api.publish(buildDoc()).then(function(){ dirty=false; setStatus('saved'); })
      .catch(function(err){
        var c = err && err.code;
        if (c === 'conflict') setStatus('someone else saved first — reloading to their version');
        else if (c === 'not_granted' || c === 'not_writer') { canWrite=false; setStatus(null); }
        else setStatus('could not save — your work is kept in this browser');
      });
  }

  function setStatus(msg){
    var el = document.getElementById('sbar'); if (!el) return;
    if (msg) { el.className='status ok'; el.innerHTML='<b>'+esc(msg)+'</b>'; return; }
    var who = WHO ? ' This copy belongs to <b>'+esc(WHO)+'</b>.' : '';
    if (canWrite) { el.className='status ok';
      el.innerHTML='<b>Saving is on.</b> Answers are written back into this page as you go, so '
        +'they survive closing the tab.'+who+' When you finish, press '
        +'<b>export my answers</b> as well &mdash; that is the copy we load into the system.'; }
    else { el.className='status ro';
      el.innerHTML='<b>Read-only &mdash; nothing is being saved back to us.</b> Your answers are '
        +'kept in this browser alone and we cannot see them.'+who+' Work through the list, then '
        +'press <b>export my answers</b> and send us the file. That is the only way your work '
        +'reaches us.'; }
  }

  try {
    var raw = localStorage.getItem(LSKEY);
    if (raw) { var by={}; JSON.parse(raw).forEach(function(o){ by[o.id]=o; });
      allItems().forEach(function(x){ var o=by[x.id];
        if (o && !x.v && (o.v || o.note)) { x.v=o.v; x.note=o.note; } }); }
  } catch(_){}

  root.dataset.tab = S.sections[0].id;
  render(); setStatus(null);

  if (window.claude && claude.use) {
    claude.use('artifact').then(function(a){
      if (!a) return; api=a; canWrite=true; setStatus(null);
    }).catch(function(){});
    claude.use('downloads').then(function(d){ if (d) dl=d; }).catch(function(){});
  }
})();
</script>


</body>
